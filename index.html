<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* layout: one centered 4:5 stage (low-res 3D canvas upscaled), HUD on top, controls + notes beneath */
:root{
  --bg:#070a18; --panel:#0e1330; --ink:#e8ecff; --dim:#8e97c4; --red:#ff3b4a; --line:#242c5e;
  --font-d:'Orbitron','Noto Sans KR',system-ui,sans-serif;
  --font-b:'Noto Sans KR',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font-b);
  padding-block:18px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font:700 20px/1.3 var(--font-d);letter-spacing:.04em}
h1 b{color:var(--red);font-weight:400}
.tag{font:700 10px/1.4 var(--font-d);color:var(--dim);letter-spacing:.08em}
.stage{position:relative;aspect-ratio:4/5;width:100%;border:2px solid var(--line);background:#000;overflow:hidden;cursor:pointer;touch-action:manipulation}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:10px 12px;font:700 13px/1 var(--font-d);color:#fff;text-shadow:0 1px 0 #000,0 0 5px rgba(0,0,0,.7);pointer-events:none}
.hud .ph{color:var(--red)}
.cta{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);font:700 14px/1 var(--font-d);color:#fff;background:var(--red);padding:11px 14px;border:0;letter-spacing:.06em;box-shadow:0 3px 0 #7d1220;cursor:pointer;animation:blink 1s steps(2) infinite}
.title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;background:linear-gradient(rgba(4,6,20,.55),rgba(4,6,20,.05) 65%,rgba(4,6,20,.4))}
.title[hidden]{display:none}
.title h2{margin:0 0 14px;font:700 clamp(44px,13vw,70px)/1 var(--font-d);letter-spacing:.06em;color:#fff;transform:perspective(500px) rotateX(14deg);text-shadow:0 2px 0 #c7c9d6,0 4px 0 #8f93a8,0 6px 0 #565a73,0 8px 0 #2a2d44,0 14px 26px rgba(0,0,0,.6)}
.title h2 b{color:#ff3548;font-weight:700;text-shadow:0 2px 0 #c01f30,0 4px 0 #8a1524,0 6px 0 #5a0d18,0 8px 0 #2f060c,0 14px 26px rgba(255,53,72,.45)}
.title p{margin:0;font:700 12px/1 var(--font-d);letter-spacing:.34em;color:#9fb0ff;text-shadow:0 1px 0 #000}
.bestT{position:absolute;right:12px;top:12px;font:700 11px/1 var(--font-d);letter-spacing:.08em;color:#ffc83a;text-shadow:0 1px 0 #000}
.title .go{position:absolute;bottom:9%;font:700 13px/1 var(--font-d);letter-spacing:.08em;color:#fff;text-shadow:0 1px 0 #000;animation:blink 1s steps(2) infinite}
.result{position:absolute;left:50%;top:46%;width:74%;transform:translate(-50%,-50%) perspective(600px) rotateX(8deg);padding:16px 14px 14px;text-align:center;background:linear-gradient(rgba(20,26,66,.92),rgba(8,10,28,.94));border:2px solid #3a4680;border-radius:4px;box-shadow:0 10px 0 #060914,0 0 30px rgba(120,150,255,.3);font-family:var(--font-d);color:#e6ebf8;animation:rpop .5s .45s both ease-out;pointer-events:none}
.result[hidden]{display:none}
@keyframes rpop{from{opacity:0;transform:translate(-50%,-40%) perspective(600px) rotateX(30deg)}to{opacity:1;transform:translate(-50%,-50%) perspective(600px) rotateX(8deg)}}
.rt{font-size:14px;font-weight:700;letter-spacing:.2em;color:#ff5a6a}
.rd{font-size:38px;font-weight:700;margin:8px 0 6px;color:#fff;text-shadow:0 3px 0 #1a2142}
.rr{font-size:12px;font-weight:700;letter-spacing:.14em;color:#ffc83a;margin-bottom:8px;animation:blink .8s steps(2) infinite}
.result dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:10px 4px 12px;font-size:11px;letter-spacing:.08em}
.result dt{text-align:left;color:#8a93c0}.result dd{margin:0;text-align:right;font-weight:700}
.rankT,.rankR{display:grid;grid-auto-flow:column;grid-template-rows:repeat(5,auto);gap:3px 16px;font:700 10px/1.3 var(--font-d);letter-spacing:.06em;color:#9fb0ff}
.rankT{position:absolute;bottom:17%;width:60%;max-width:280px;text-shadow:0 1px 0 #000}
.rankR{margin:0 2px 12px}
.rk{display:flex;justify-content:space-between;gap:8px}.rk b{color:#6a74a8;font-weight:700}.rk i{font-style:normal}
.rk.me{color:#ffc83a}.rk.me b{color:#ffc83a}
.rg{font-size:11px;letter-spacing:.06em;color:#9fb0ff;animation:blink 1s steps(2) infinite}
.pause{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,6,20,.6);font:700 26px/1 var(--font-d);letter-spacing:.22em;color:#fff;text-shadow:0 3px 0 #1a2142;pointer-events:none}
.pause[hidden]{display:none}
.count{position:absolute;left:0;right:0;top:30%;text-align:center;font:700 64px/1 var(--font-d);color:#fff;text-shadow:0 4px 0 #1a2142,0 0 22px rgba(120,150,255,.6);pointer-events:none;animation:cpop .4s ease-out}
.count[hidden]{display:none}
@keyframes cpop{from{opacity:0;transform:scale(1.7)}to{opacity:1;transform:scale(1)}}
.gauge{position:absolute;left:50%;bottom:8%;width:62%;transform:translateX(-50%);text-align:center;font:700 12px/1 var(--font-d);color:#e6ebf8;text-shadow:0 1px 0 #000;cursor:pointer}
.gauge[hidden]{display:none}
.gt{letter-spacing:.2em;font-size:11px;margin-bottom:12px;color:#9fb0ff}
.gbar{position:relative;height:16px;margin:0 auto 16px;background:linear-gradient(#1a2142,#0b1022);border:2px solid #3a4680;border-radius:3px;transform:perspective(420px) rotateX(38deg);box-shadow:0 8px 0 #060914,0 0 18px rgba(120,150,255,.35)}
.gg{position:absolute;top:0;bottom:0;left:27%;width:46%;background:linear-gradient(#e8bb45,#a97d1c)}
.gp{position:absolute;top:0;bottom:0;left:41%;width:18%;background:linear-gradient(#6cf0a8,#1fa866);box-shadow:0 0 12px #2fd37a}
.gm{position:absolute;top:-8px;bottom:-8px;left:50%;width:5px;margin-left:-2.5px;background:#fff;box-shadow:0 0 8px #fff,0 0 0 1px #000}
.gh{font-size:11px;letter-spacing:.06em;animation:blink 1s steps(2) infinite}
.grade{position:absolute;left:0;right:0;top:24%;text-align:center;font:700 30px/1 var(--font-d);letter-spacing:.06em;text-shadow:0 2px 0 #000;pointer-events:none;opacity:0}
.grade.on{animation:gpop 1.6s ease-out forwards}
@keyframes gpop{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.18)}22%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.cap{white-space:pre-line;position:absolute;left:0;right:0;bottom:6%;text-align:center;font:700 12px/1.6 var(--font-d);color:#fff;text-shadow:0 1px 0 #000,0 0 6px rgba(0,0,0,.7);pointer-events:none}
.cap[hidden]{display:none}
.fuel,.roll{position:absolute;left:12px;display:flex;align-items:center;box-sizing:border-box;height:26px;padding:0 9px;border-radius:8px;background:rgba(8,12,38,.55);border:1px solid rgba(255,255,255,.2);box-shadow:0 2px 8px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);font:700 11px/1 var(--font-d);letter-spacing:.08em;color:#cfe3ff;pointer-events:none;text-shadow:0 1px 0 #000}
.fuel{top:36px;width:46%;gap:8px}
.fuel[hidden],.roll[hidden]{display:none}
.roll{top:68px;gap:5px}
.fuel span,.roll span{display:inline-block;width:38px;opacity:.85}
.fuel i{flex:1;height:12px;box-sizing:border-box;position:relative;overflow:hidden;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.35);border-radius:4px;display:block}
.fuel i::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 2px),rgba(8,12,38,.95) calc(10% - 2px),rgba(8,12,38,.95) 10%)}
.fuel b{display:block;height:100%;width:100%;background:linear-gradient(90deg,#2fb8ff,#7dffd6);box-shadow:0 0 8px rgba(80,220,255,.7)}
.roll i{width:22px;height:12px;box-sizing:border-box;background:linear-gradient(#8fd0ff,#4a9cff);border:1px solid rgba(255,255,255,.7);border-radius:4px;box-shadow:0 0 7px rgba(90,170,255,.7);display:block}
.roll i.off{background:rgba(0,0,0,.5);border-color:rgba(255,255,255,.3);box-shadow:none}
.zone{position:absolute;left:0;right:0;top:22%;text-align:center;font:700 18px/1.4 var(--font-d);color:#fff;letter-spacing:.1em;text-shadow:0 2px 0 #000;opacity:0;transition:opacity .4s;pointer-events:none}
.zone.on{opacity:1}
.zone small{display:block;margin-top:12px;font-size:13px;font-weight:700;color:var(--red);letter-spacing:.2em}
.cut{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s}
.cut.on{opacity:1}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .14s}
.flash.on{opacity:1}
@keyframes blink{50%{opacity:.55}}
.ctl{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.seg{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.seg div{display:flex}
button.opt{font:700 12px/1 var(--font-b);color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:9px 12px;margin:0 -1px 0 0;cursor:pointer}
button.opt[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
button.opt:focus-visible,.cta:focus-visible{outline:2px solid #fff;outline-offset:2px}
.notes{margin:0;padding:12px 14px;background:var(--panel);border:1px solid var(--line);display:grid;gap:7px;list-style:none;font-size:13px;line-height:1.55;color:var(--dim)}
.notes b{color:var(--ink)}
.err{display:none;padding:16px;border:1px solid var(--red);font-size:13px}
@media (max-width:600px){
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{padding:0}
  header{display:none}
  .wrap{max-width:none;margin:0;gap:0}
  .stage{position:fixed;left:0;top:0;width:100%;height:100vh;height:100dvh;aspect-ratio:auto;border:0}
  .hud{padding:calc(10px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) 10px calc(12px + env(safe-area-inset-left,0px))}
  .fuel{top:calc(38px + env(safe-area-inset-top,0px))}
  .roll{top:calc(70px + env(safe-area-inset-top,0px))}
  .bestT{top:calc(12px + env(safe-area-inset-top,0px))}
  .ctl{position:fixed;left:0;right:0;bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:5;padding:0 14px;opacity:.55}
  .err{margin:16px}
}
@media (prefers-reduced-motion:reduce){.cta{animation:none}}
</style>

<div class="wrap">
  <header>
    <h1>HI-<b>LOOP</b> 3D</h1>
    
  </header>

  <div class="stage" id="stage" role="img" aria-label="3D 오프닝 시안: C자 램프를 오르는 흰색 쿠페가 오른쪽으로 발사되는 장면">
    <canvas id="cv"></canvas>
    <div class="hud" id="hud"><span id="hudBest">BEST 0M</span><span class="ph" id="ph">READY</span></div>
    <div class="gauge" id="cta"><div class="gt">TIMING</div><div class="gbar"><i class="gg"></i><i class="gp"></i><b class="gm" id="gm"></b></div><div class="gh" id="gh">PRESS SPACE IN THE GREEN!</div></div>
    <div class="grade" id="grade"></div>
    <div class="count" id="count" hidden></div>
    <div class="title" id="title"><div class="bestT" id="bestT">BEST 0M</div><h2>HI-<b>LOOP</b></h2><p>LOOP. FLY. LAND.</p><div class="rankT" id="rankT" hidden></div><div class="go" id="goT">PRESS SPACE TO START</div></div>
    <div class="result" id="result" hidden><div class="rt" id="rTitle">GAME OVER</div><div class="rd" id="rDist">0M</div><div class="rr" id="rRec" hidden>NEW RECORD!</div><dl><dt>ZONE</dt><dd id="rZone">NIGHT</dd><dt>CELLS</dt><dd id="rCells">0</dd></dl><div class="rankR" id="rankR"></div><div class="rg" id="rGo">PRESS SPACE TO RETRY</div></div>
    <div class="cap" id="cap" hidden>HERE → 2D GAMEPLAY</div>
    <div class="zone" id="zone"></div>
    <div class="fuel" id="fuel" hidden><span>FUEL</span><i><b id="fuelBar"></b></i></div>
    <div class="roll" id="rollHud" hidden><span>ROLL</span><i></i><i></i><i></i></div>
    <div class="pause" id="ovPause" hidden>PAUSED</div>
    <div class="cut" id="cut"></div>
    <div class="flash" id="flash"></div>
  </div>
  <div class="err" id="err">이 브라우저에서는 3D(WebGL)를 켤 수 없어 시안을 표시하지 못합니다.</div>

  <div class="ctl">
    <button class="opt" type="button" id="replay" style="margin:0">처음부터</button>
    <span><button class="opt" type="button" id="pauseBtn">PAUSE</button><button class="opt" type="button" id="sndBtn" aria-pressed="false">SND ON</button></span>
  </div>

</div>

<script src="three.min.js"></script>
<script>
(function(){
  var T=window.THREE;
  var $=function(id){return document.getElementById(id)};
  var cv=$('cv'),stage=$('stage'),phEl=$('ph'),cta=$('cta'),cap=$('cap'),cut=$('cut');
  var renderer;
  var why='';
  try{
    if(!T){why='3D 라이브러리(three.js)를 불러오지 못했습니다.';throw new Error(why);}
    var gl=null;
    try{gl=cv.getContext('webgl2')||cv.getContext('webgl')||cv.getContext('experimental-webgl');}catch(e0){}
    if(!gl){why='이 화면에서 WebGL이 꺼져 있습니다. (브라우저 설정 또는 하드웨어 가속)';throw new Error(why);}
    renderer=new T.WebGLRenderer({canvas:cv,context:gl,antialias:false});
  }catch(e){
    stage.style.display='none';
    var er=$('err');er.style.display='block';
    er.textContent='시안을 표시하지 못했습니다. '+(why||('오류: '+(e&&e.message)));
    return;
  }
  renderer.setPixelRatio(1);

  /* ---------- 사운드: 마스터(컴프레서) + 리버브 + 딜레이 ---------- */
  var ac=null,muted=false,paused=false,mst=null,revIn=null,dlyIn=null,dlyNode=null,noiseBuf=null,driveCurve=null;
  try{muted=localStorage.getItem('hiloop-mute')==='1';}catch(e){}
  function audio(){
    if(muted)return;
    try{
      if(!ac){
        var C=window.AudioContext||window.webkitAudioContext;if(!C)return;
        ac=new C();
        mst=ac.createGain();mst.gain.value=0.9;
        var cp=ac.createDynamicsCompressor();cp.threshold.value=-14;cp.knee.value=18;cp.ratio.value=5;cp.attack.value=0.004;cp.release.value=0.2;
        mst.connect(cp);cp.connect(ac.destination);
        var len=Math.floor(ac.sampleRate*1.7),ib=ac.createBuffer(2,len,ac.sampleRate),ch,i,d;
        for(ch=0;ch<2;ch++){d=ib.getChannelData(ch);for(i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
        var cvn=ac.createConvolver();cvn.buffer=ib;var rg=ac.createGain();rg.gain.value=0.5;
        revIn=ac.createGain();revIn.connect(cvn);cvn.connect(rg);rg.connect(mst);
        var dl=ac.createDelay(1.0);dl.delayTime.value=0.3;dlyNode=dl;var fb=ac.createGain();fb.gain.value=0.26;var df=ac.createBiquadFilter();df.type='lowpass';df.frequency.value=2400;
        dlyIn=ac.createGain();dlyIn.connect(dl);dl.connect(df);df.connect(fb);fb.connect(dl);df.connect(mst);
      }
      if(ac.state==='suspended'&&ac.resume&&!paused)ac.resume();
    }catch(e){}
  }
  function ok(){return !!(ac&&mst&&!muted);}
  function out(g,rev,dly,pan){
    if(pan!==undefined&&ac.createStereoPanner){var pn=ac.createStereoPanner();pn.pan.value=pan;g.connect(pn);pn.connect(mst);}else g.connect(mst);
    if(rev){var r=ac.createGain();r.gain.value=rev;g.connect(r);r.connect(revIn);}
    if(dly){var q=ac.createGain();q.gain.value=dly;g.connect(q);q.connect(dlyIn);}
  }
  function nbuf(){
    if(!noiseBuf){var n=ac.sampleRate*2,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0),i;for(i=0;i<n;i++)d[i]=Math.random()*2-1;noiseBuf=b;}
    return noiseBuf;
  }
  function tone(f1,f2,dur,type,vol,o){
    o=o||{};if(!ok())return;
    try{
      var t=ac.currentTime+(o.at||0),os=ac.createOscillator(),g=ac.createGain(),last=os;
      os.type=type||'sine';os.frequency.setValueAtTime(f1,t);if(f2)os.frequency.exponentialRampToValueAtTime(f2,t+dur);
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.06,t+(o.atk||0.006));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      if(o.lp){var fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;os.connect(fl);last=fl;}
      if(o.drive){var ws=ac.createWaveShaper();if(!driveCurve){driveCurve=new Float32Array(256);for(var di=0;di<256;di++){var dx=di/128-1;driveCurve[di]=Math.tanh(dx*3.5);}}ws.curve=driveCurve;last.connect(ws);last=ws;}
      last.connect(g);out(g,o.rev,o.dly,o.pan);os.start(t);os.stop(t+dur+0.05);
    }catch(e){}
  }
  function nz(dur,vol,type,f1,f2,o){
    o=o||{};if(!ok())return;
    try{
      var t=ac.currentTime+(o.at||0),s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();
      s.buffer=nbuf();fl.type=type||'lowpass';fl.frequency.setValueAtTime(f1,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);fl.Q.value=o.q||0.8;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+(o.atk||0.01));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      s.connect(fl);fl.connect(g);out(g,o.rev,0,o.pan);s.start(t,Math.random());s.stop(t+dur+0.05);
    }catch(e){}
  }
  function bell(f,dur,vol,o){
    o=o||{};if(!ok())return;
    try{
      var t=ac.currentTime+(o.at||0),car=ac.createOscillator(),mod=ac.createOscillator(),mg=ac.createGain(),g=ac.createGain();
      car.type='sine';mod.type='sine';car.frequency.setValueAtTime(f,t);mod.frequency.setValueAtTime(f*(o.ratio||3.5),t);
      mg.gain.setValueAtTime(f*(o.idx||1.6),t);mg.gain.exponentialRampToValueAtTime(f*0.02,t+dur);
      mod.connect(mg);mg.connect(car.frequency);
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.004);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      car.connect(g);out(g,o.rev===undefined?0.3:o.rev,o.dly,o.pan);car.start(t);mod.start(t);car.stop(t+dur+0.05);mod.stop(t+dur+0.05);
    }catch(e){}
  }
  /* 묵직한 휘익: 대역이 올라갔다 내려오는 노이즈 */
  function whoosh(dur,vol,fLow,fPeak,fEnd,o){
    o=o||{};if(!ok())return;
    try{
      var t=ac.currentTime+(o.at||0),s2=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();
      s2.buffer=nbuf();fl.type=o.type||'bandpass';fl.Q.value=o.q||0.9;
